name: Refresh HuggingFace index

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Rebuild metadata/hf-index.json
        run: python tools/build_hf_index.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- metadata/hf-index.json; then
            echo "Index unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/hf-index.json
          git commit -m "Refresh HuggingFace file index"
          git push
